# Put this file in your repo at: .github/workflows/build.yml
# Upload "LearnVocabulary.zip" to the repo root (same level as README).
# Optionally upload "words.json" to the repo root too.
name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          # project may be zipped with or without a top-level folder
          if [ -f /tmp/proj/settings.gradle.kts ]; then ROOT=/tmp/proj; else ROOT=$(dirname "$(find /tmp/proj -maxdepth 2 -name settings.gradle.kts | head -n 1)"); fi
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          # words.json uploaded to repo root is copied into the app assets
          if [ -f words.json ]; then mkdir -p "$ROOT/app/src/main/assets"; cp words.json "$ROOT/app/src/main/assets/words.json"; fi
          test -f "$ROOT/app/src/main/assets/words.json" || (echo "ERROR: words.json is missing" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: learn-vocabulary-release-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
